<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10161d">
<title>Page not found — Md Munna</title>
<link rel="icon" href="/portfolio/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;
    font-family:'Inter',system-ui,sans-serif;color:#e9eef4;
    background:radial-gradient(900px 560px at 50% -10%,rgba(79,209,197,.07),transparent 60%),#10161d}
  .code{font-family:'JetBrains Mono',monospace;font-size:.78rem;letter-spacing:.2em;
    text-transform:uppercase;color:#4fd1c5}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(2rem,7vw,3.2rem);font-weight:700;
    letter-spacing:-.02em;margin:14px 0 12px}
  p{color:#b3bfcc;max-width:46ch;margin:0 auto 28px;line-height:1.7}
  a{display:inline-flex;align-items:center;gap:9px;background:#4fd1c5;color:#0c1218;
    padding:13px 26px;border-radius:999px;font-weight:600;font-size:.88rem;text-decoration:none;
    box-shadow:0 10px 26px -12px rgba(79,209,197,.4);transition:transform .18s,background .2s}
  a:hover{background:#3fbcb0;transform:translateY(-2px)}
  .rule{width:46px;height:3px;background:#4fd1c5;border-radius:2px;margin:0 auto 22px}
</style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>This page doesn't exist</h1>
    <div class="rule"></div>
    <p>The link may be outdated, or the address has a typo. Everything on the site is reachable from the home page.</p>
    <a href="/portfolio/">Back to the portfolio</a>
  </main>
</body>
</html>
